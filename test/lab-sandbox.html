<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ReadTune — Voice Fit sandbox</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../lab.css" />
    <script>
      (function () {
        const profile = {
          font: "atkinson", fontSize: 20, lineHeight: 1.7, letterSpacing: 0.02, wordSpacing: 0.08,
          paragraphSpacing: 1.1, columnWidth: 64, bionic: 0, overlay: "cream", customTint: "#eef3f8",
          contrast: 94, focus: "off", rulerLines: 1, rulerHeight: 40, pacing: "flow", wpm: 260,
          ttsVoice: "", ttsRate: 1, hyphenate: false, syllables: false, deItalic: false,
          hideImages: false, freezeMotion: false, dyslexicUiMode: false,
        };
        const mem = {
          local: {
            readtune_profile: profile,
            readtune_tts: { provider: "piper", piperVoice: "en_US-lessac-medium" },
            readtune_calibrations: [],
          },
          session: {},
        };
        window.chrome = {
          runtime: { getURL: (path) => new URL("../" + path.replace(/^\.?\//, ""), location.href).href, id: "sandbox" },
          permissions: { contains: async () => false, request: async () => false, remove: async () => true },
          storage: {
            local: {
              async get(key) { return key == null ? { ...mem.local } : { [key]: mem.local[key] }; },
              async set(values) { Object.assign(mem.local, values); },
              async remove(key) { delete mem.local[key]; },
            },
            session: {
              async get(key) { return key == null ? { ...mem.session } : { [key]: mem.session[key] }; },
              async set(values) { Object.assign(mem.session, values); },
              async remove(key) { delete mem.session[key]; },
            },
          },
        };
      })();
    </script>
  </head>
  <body class="rt-ui rt-reading-page rt-lab-page">
    <div class="lab-wrap">
      <header class="lab-hero"><section class="lab-hero-copy"><span class="rt-chip">Reading Lab</span><h1 id="lab-hero-title"></h1><p id="lab-hero-body"></p></section><section class="lab-hero-stats"><article class="lab-stat"><strong id="lab-confidence-label"></strong><p id="lab-confidence-body"></p></article><article class="lab-stat"><strong id="lab-stability-label"></strong><p id="lab-stability-body"></p></article><article class="lab-stat"><strong id="lab-runs-label"></strong><p id="lab-runs-body"></p></article></section></header>
      <section id="lab-empty" hidden></section><section id="lab-main"><div id="lab-profile-title"></div><div id="lab-profile-desc"></div><div id="lab-profile-tags"></div><div id="lab-preview-surface"><div id="lab-preview-view"></div></div><div id="lab-last-tested"></div><div id="lab-signal-title"></div><div id="lab-signal-body"></div><div id="lab-next-title"></div><div id="lab-next-body"></div></section>
      <section id="lab-evidence-grid"><div id="lab-foundations"></div><div id="lab-experiments"></div></section><section id="lab-detail-grid"><div id="lab-leaderboard"></div><div id="lab-use-cases"></div></section>
      <section id="lab-voice-panel"><span id="lab-voice-badge"></span><strong id="lab-voice-title"></strong><p id="lab-voice-body"></p><p id="lab-voice-copy"></p><div id="lab-voice-surface"><div id="lab-voice-preview-view"></div></div><div id="lab-voice-list"></div></section>
      <section id="lab-assist-panel"><span id="lab-assist-badge"></span><p id="lab-assist-body">"Summary" and "Simplify" in Reader View.</p><p id="lab-assist-status" role="status"></p><div id="lab-assist-key-row" hidden><input id="lab-assist-key" type="password" /><button id="lab-assist-key-save" type="button">Save key</button></div><button id="lab-assist-key-forget" type="button" hidden>Remove</button></section>
      <section id="lab-history-panel"><div id="lab-timeline"></div></section><section id="lab-trust-panel"><ul id="lab-trust-list"></ul></section>
      <button id="lab-retake"></button><button id="lab-pdf"></button><button id="lab-apply-starter"></button><button id="lab-close"></button>
    </div>
    <script type="module" src="../lab.js"></script>
  </body>
</html>
