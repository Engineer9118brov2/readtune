name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static checks (syntax, manifest, asset references)
        run: npm run check
      - name: Behavioural harness (headless Chrome)
        run: npm run harness
      - name: Build the Web Store zip
        run: npm run build
