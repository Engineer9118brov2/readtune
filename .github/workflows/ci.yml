name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only needs to read the checkout. Declaring this explicitly prevents the
# repository/default token policy from silently granting broader write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Full policy, privacy, lifecycle, Store asset, and behavioural checks
        run: npm test
      - name: Behavioural harness (headless Chrome)
        run: npm run harness
      - name: Bundled Piper model smoke test (headless Chrome)
        run: npm run piper-smoke
      - name: Build the Web Store zip
        run: npm run build